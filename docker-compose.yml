services:
  pihole:
    container_name: pihole

    image: pihole/pihole:latest

    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8081:80/tcp"
      - "443:443/tcp"

    environment:
      TZ: '${TZ}'
      FTLCONF_webserver_api_password: '${PIHOLE_PASSWD}'
      FTLCONF_dns_listeningMode: 'ALL'

    volumes:
      - './etc-pihole:/etc/pihole'

    cap_add:
      - NET_ADMIN
      - SYS_TIME
      - SYS_NICE

    restart: unless-stopped

  audiobookshelf:
    container_name: audiobookshelf
  
    image: ghcr.io/advplyr/audiobookshelf:latest

    ports:
      - 13378:80

    volumes:
      - /home/pajamas/homelab/audiobookshelf:/config
      - /home/pajamas/homelab/audiobookshelf:/metadata


    environment:
      - TZ=Asia/Dhaka

    restart: unless-stopped
